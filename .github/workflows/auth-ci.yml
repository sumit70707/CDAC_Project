name: Auth Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'trueme-auth-service/**'

  pull_request:
    branches:
      - main
    paths:
      - 'trueme-auth-service/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: trueme-auth-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('trueme-auth-service/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Verify Auth Service
        run: mvn clean verify -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::12}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:${IMAGE_TAG} \
            .

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:${IMAGE_TAG}

      - name: Trigger Jenkins Deployment
        shell: bash
        run: |
          set +e

          for i in {1..12}
          do
            echo "Deployment attempt $i..."

            curl -f -X POST \
              "${{ secrets.JENKINS_URL }}/job/trueme-deploy/buildWithParameters?token=trueme-deploy-token&SERVICE_NAME=auth-service&IMAGE_TAG=${IMAGE_TAG}" \
              --user "${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }}"

            CURL_EXIT_CODE=$?

            if [ $CURL_EXIT_CODE -eq 0 ]; then
              echo "Jenkins deployment triggered successfully."
              exit 0
            fi

            if [ $i -lt 12 ]; then
              echo "Attempt $i failed with exit code $CURL_EXIT_CODE. Retrying in 5 minutes..."
              sleep 300
            fi
          done

          echo "Jenkins deployment trigger failed after 12 attempts."
          exit 1