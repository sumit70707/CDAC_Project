# .github/workflows/discovery-ci.yml

name: Service Discovery CI

on:
  push:
    branches:
      - main
    paths:
      - 'trueme-service-discovery/**'

  pull_request:
    branches:
      - main
    paths:
      - 'trueme-service-discovery/**'

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: trueme-service-discovery

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('trueme-service-discovery/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Test Service Discovery
        run: mvn clean verify -DskipTests