name: Notification Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'trueme-notification-service/**'

  pull_request:
    branches:
      - main
    paths:
      - 'trueme-notification-service/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: trueme-notification-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('trueme-notification-service/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Verify Notification Service
        run: mvn clean verify -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::12}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${IMAGE_TAG} \
            .

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${IMAGE_TAG}

      - name: Trigger Jenkins Deployment
        run: |
          curl -X POST \
          "${{ secrets.JENKINS_URL }}/job/trueme-deploy/buildWithParameters?token=trueme-deploy-token&SERVICE_NAME=notification-service&IMAGE_TAG=${IMAGE_TAG}" \
          --user "${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }}"