name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'trueme-app/**'

  pull_request:
    branches:
      - main
    paths:
      - 'trueme-app/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: trueme-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build React Application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::12}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${IMAGE_TAG} \
            .

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${IMAGE_TAG}

      - name: Trigger Jenkins Deployment
        shell: bash
        run: |
          set +e

          for i in {1..12}
          do
            echo "Deployment attempt $i..."

            curl -f -X POST \
              "${{ secrets.JENKINS_URL }}/job/trueme-deploy/buildWithParameters?token=trueme-deploy-token&SERVICE_NAME=frontend&IMAGE_TAG=${IMAGE_TAG}" \
              --user "${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }}"

            CURL_EXIT_CODE=$?

            if [ $CURL_EXIT_CODE -eq 0 ]; then
              echo "Jenkins deployment triggered successfully."
              exit 0
            fi

            if [ $i -lt 12 ]; then
              echo "Attempt $i failed with exit code $CURL_EXIT_CODE. Retrying in 5 minutes..."
              sleep 300
            fi
          done

          echo "Jenkins deployment trigger failed after 12 attempts."
          exit 1